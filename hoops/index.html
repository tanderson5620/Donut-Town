<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<div id="app"></div>
<canvas id="hud" width="512" height="320"></canvas>
<div id="callout"></div>
<div id="info"></div>
<div id="touchui">

  <button id="bTurbo" class="tb">TURBO</button>

  <button id="bShoot" class="tb">SHOOT</button>
  <button id="bPause" class="small">II</button>
  <button id="bCam" class="small">CAM</button>
</div>
<div id="rotate"><div>&#x21bb;</div>Turn your phone sideways to play</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>

<script src="js/court.js"></script>
<script src="js/ball.js"></script>

<script src="js/input.js"></script>
<script src="js/touch.js"></script>
<script src="js/ui.js"></script>
<script src="js/body-data.js"></script>
<script src="js/athlete.js"></script>
<script src="js/player.js"></script>
<script src="js/actions.js"></script>
<script src="js/menus.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
